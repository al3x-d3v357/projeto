<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow - Organizador Pessoal</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Supabase via CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div class="app-container">
        <!-- SIDEBAR -->
        <aside class="sidebar">
            <div class="logo">
                <div class="logo-icon">⚡</div>
                <h1>TaskFlow</h1>
            </div>
            
            <nav class="nav-menu">
                <button class="nav-item active" data-tab="tasks">
                    <span class="nav-icon">📋</span>
                    <span>Tarefas</span>
                    <span class="badge" id="tasks-badge">0</span>
                </button>
                <button class="nav-item" data-tab="habits">
                    <span class="nav-icon">🔄</span>
                    <span>Hábitos</span>
                </button>
                <button class="nav-item" data-tab="shopping">
                    <span class="nav-icon">🛒</span>
                    <span>Compras</span>
                </button>
                <button class="nav-item" data-tab="bills">
                    <span class="nav-icon">💸</span>
                    <span>Contas</span>
                </button>
            </nav>

            <div class="sidebar-footer">
                <div class="status-indicator">
                    <span class="status-dot"></span>
                    <span>Conectado ao Supabase</span>
                </div>
            </div>
        </aside>

        <!-- CONTEÚDO PRINCIPAL -->
        <main class="main-content">
            <header class="top-header">
                <div class="header-title">
                    <h2 id="page-title">Tarefas</h2>
                    <p id="page-subtitle">Organize seu dia</p>
                </div>
                <div class="header-actions">
                    <button class="btn-primary" id="btn-add">
                        <span>+</span> Adicionar
                    </button>
                </div>
            </header>

            <div class="content-area" id="content-area">
                <div class="loading"><div class="spinner"></div></div>
            </div>
        </main>
    </div>

    <!-- MODAL -->
    <div class="modal-overlay" id="modal-overlay">
        <div class="modal" id="modal">
            <div class="modal-header">
                <h3 id="modal-title">Título</h3>
                <button class="modal-close" id="modal-close">&times;</button>
            </div>
            <div class="modal-body" id="modal-body"></div>
        </div>
    </div>

    <!-- TOAST -->
    <div class="toast-container" id="toast-container"></div>

    <script src="app.js"></script>
</body>
</html>
